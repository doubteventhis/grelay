name: Build Releases
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: grelay-linux-amd64
          - goos: linux
            goarch: arm64
            output: grelay-linux-arm64
          - goos: windows
            goarch: amd64
            output: grelay-windows-amd64.exe
          - goos: windows
            goarch: arm64
            output: grelay-windows-arm64.exe
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.7'
      
      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o ${{ matrix.output }} .
      
      - name: Upload to Release
        run: gh release upload ${{ github.ref_name }} ${{ matrix.output }}
        env:
          GH_TOKEN: ${{ github.token }}
